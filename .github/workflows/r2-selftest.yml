name: R2 Selftest

# 只手动触发：验证「R2 凭据 + 上传步骤」在 GitHub 机器上能不能跑通。
# 不打包、不发 Release、不动版本号，只在 R2 里放一个 1KB 探针，验完立刻删掉。
# 用法：Actions 页面选这个 workflow → Run workflow；或 gh workflow run r2-selftest.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: macos-latest
    steps:
      - name: Probe R2 round trip
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://32226aa9b7c86d4183d6610f9f79593c.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          KEY="${{ github.repository }}/releases/download/_selftest/probe.txt"
          URL="$R2_ENDPOINT/app-releases/$KEY"
          printf 'r2 selftest %s\n' "$(date -u +%FT%TZ)" > probe.txt

          echo "▸ curl：$(curl --version | head -1)"
          echo "▸ 上传探针 → $KEY"
          curl -sS --fail-with-body \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
            -X PUT -T probe.txt \
            -H "Content-Type: text/plain; charset=utf-8" \
            -H "Cache-Control: public, max-age=60" \
            "$URL"

          echo "▸ S3 直接回读"
          curl -sS --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" "$URL"

          echo "▸ 经 gh-proxy 读，必须命中 R2"
          SRC="$(curl -sSI "https://gh-proxy.kexuejia.qzz.io/https://github.com/$KEY" \
            | tr -d '\r' | awk 'tolower($1)=="x-source:"{print $2}')"
          echo "  x-source=${SRC:-<空>}"
          test "$SRC" = "r2" || { echo "✗ 经代理没命中 R2"; exit 1; }

          echo "▸ 清理探针"
          curl -sS -o /dev/null -w "  delete HTTP %{http_code}\n" \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
            -X DELETE "$URL"
          echo "✓ 自检完成"
