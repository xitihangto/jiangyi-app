name: Release

# 只在推标签 v* 时跑（例如 v0.21），推 main 不会触发。
# 打标签并推送后，GitHub macOS runner 上自动构建并发布同名 Release。
# 分发命令（公开库，对方终端粘贴一行就能下，不用登录、不用 token）：
#   curl -L --fail -o ~/Downloads/LectureGen-v0.21.zip \
#     https://github.com/xitihangto/jiangyi-app/releases/download/v0.21/LectureGen-v0.21.zip
# 地址最后一段必须跟下面打包出来的文件名一字不差；标签和产物名都用 github.ref_name 拼，
# 换标签就换地址，不用改这个文件。
# 注意：产物是 build.sh 里的临时签名（codesign --sign -），不是 Developer ID 签名 + 公证，
# 靠 curl 不打隔离属性绕过 Gatekeeper；如果苹果以后收紧这条路，要重新测。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        # 只构建到 dist，不用 --install：runner 上不需要装到 /Applications，也不需要启动 App。
        run: ./build.sh

      - name: Check built app version matches tag
        run: |
          test -d "dist/讲义生成.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "dist/讲义生成.app/Contents/Info.plist")"
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG app_version=$VERSION"
          test "$VERSION" = "${TAG#v}" || { echo "版本与标签不一致：包内是 $VERSION，标签是 $TAG，已停止"; exit 1; }

      - name: Pack
        run: |
          ditto -c -k --keepParent "dist/讲义生成.app" "LectureGen-${{ github.ref_name }}.zip"
          ls -lh "LectureGen-${{ github.ref_name }}.zip"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            LectureGen-${{ github.ref_name }}.zip

      # ---- 同步到 R2：让 gh-proxy 从 CF 内部直出，不再跨境回源 GitHub ----
      # R2 的 key 规则必须和 worker 里的匹配规则一致：<owner>/<repo>/<tag>/<asset>
      # 凭据是仓库 Secrets 里的 R2 API Token（Object Read & Write，只限 app-releases）。
      # 这一步失败就让整个 job 红掉 —— 否则会静悄悄退化成「跨境回源，慢但能用」，
      # 这种失败最难发现，所以宁可报错。
      - name: Mirror to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://32226aa9b7c86d4183d6610f9f79593c.r2.cloudflarestorage.com
          ASSET: LectureGen-${{ github.ref_name }}.zip
        run: |
          set -euo pipefail
          KEY="${{ github.repository }}/${{ github.ref_name }}/$ASSET"
          URL="$R2_ENDPOINT/app-releases/$KEY"
          echo "▸ 上传 $ASSET → $KEY"
          curl -sS --fail-with-body \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
            -X PUT -T "$ASSET" \
            -H "Content-Type: application/zip" \
            -H "Cache-Control: public, max-age=31536000, immutable" \
            "$URL"
          LOCAL="$(stat -f%z "$ASSET")"
          REMOTE="$(curl -sSI --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" "$URL" \
            | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')"
          echo "  local=$LOCAL remote=$REMOTE"
          test "$LOCAL" = "$REMOTE" || { echo "R2 上的大小和本地不一致，已停止"; exit 1; }
          echo "✓ 已同步到 R2"
